version: 1

# Optional per-day workload forecast.
#
# Each workload entry may specify:
#   jobs: integer
#   units: number
#   expected_cost_usd: number
#
# If expected_cost_usd is omitted, `units` is converted with the
# fallback_cost_per_unit_usd in configs/budget-ledger.yaml.
#
# Keep this file sparse: dates without entries are treated as no explicitly
# scheduled workload, while historical weekday demand still contributes.
dates: {}
