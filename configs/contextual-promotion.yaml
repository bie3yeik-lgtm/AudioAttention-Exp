version: 1

evaluation:
  min_evaluable_runs: 30
  min_same_route_runs: 10
  min_paired_probes: 5

promotion:
  max_contextual_cost_mape: 0.25
  max_contextual_runtime_mape: 0.30

  # Contextual must beat Historical on realized cost prediction.
  min_mean_absolute_error_improvement_ratio: 0.05

  # On route-selection opportunities, Contextual should not be worse overall.
  min_mean_realized_regret_improvement_usd: 0.00

  # Paired probes provide direct route-vs-route evidence.
  min_paired_winner_accuracy: 0.60

  # Require at least this fraction of contextual decisions to be evaluable.
  min_evaluation_coverage: 0.70

  require_non_negative_median_error_improvement: true

deployment:
  fail_closed_to_historical: true
