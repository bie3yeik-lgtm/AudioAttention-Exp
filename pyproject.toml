[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-editorial-context"
version = "0.1.0"
description = "Audio-context and editorial-decision pipeline using Parakeet and Step-Audio."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2",
  "pyarrow>=16",
  "pydantic>=2.7",
  "PyYAML>=6",
  "tqdm>=4.66",
  "scikit-learn>=1.5",
  "soundfile>=0.12",
  "librosa>=0.10.2",
  "torch>=2.3",
]

[tool.setuptools.packages.find]
where = ["src"]
