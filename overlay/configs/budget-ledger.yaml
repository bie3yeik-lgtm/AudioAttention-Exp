version: 1

timezone: Asia/Tokyo

storage:
  prefix: budget-ledger/v1

reservation:
  ttl_hours: 12
  # Reserve the conformal upper bound when available; otherwise expected cost.
  amount_source: upper_then_expected

pacing:
  enabled: true
  mode: enforce
  # Recompute today's allowance from the remaining monthly budget and
  # remaining calendar days (including today). Under-spend automatically
  # carries forward; over-spend reduces later daily allowances.
  pace_multiplier: 1.0
  min_daily_allowance_usd: 0.0
  max_daily_allowance_usd: null

  env_overrides:
    enabled: GPU_BUDGET_PACING_ENABLED
    mode: GPU_BUDGET_PACING_MODE
    pace_multiplier: GPU_BUDGET_PACING_MULTIPLIER
    min_daily_allowance_usd: GPU_BUDGET_PACING_MIN_DAILY_USD
    max_daily_allowance_usd: GPU_BUDGET_PACING_MAX_DAILY_USD

forecast:
  enabled: true

  # Historical demand window used to estimate weekday GPU demand.
  history_lookback_days: 56

  # Demand-weight blending. The values do not have to sum to one; they are
  # normalized internally.
  weights:
    baseline: 0.10
    weekday_history: 0.45
    scheduled_jobs: 0.45

  # Regularizes sparse weekday history toward neutral demand.
  weekday_smoothing_days: 2.0

  # Prevent one unusual day from taking essentially the whole month budget.
  min_day_weight: 0.25
  max_day_weight: 4.0

  # Planned Teacher/Student workload forecast.
  # Can be overridden with GPU_BUDGET_FORECAST_FILE.
  schedule_file: configs/budget-demand-forecast.yaml
  sources_file: configs/forecast-sources.yaml

  # Used only when a schedule row provides `units` but not
  # `expected_cost_usd`.
  fallback_cost_per_unit_usd:
    teacher: 0.40
    student: 0.25

  fallback_cost_per_job_usd:
    teacher: 0.40
    student: 0.25

  env_overrides:
    enabled: GPU_BUDGET_FORECAST_ENABLED
    schedule_file: GPU_BUDGET_FORECAST_FILE
    history_lookback_days: GPU_BUDGET_FORECAST_LOOKBACK_DAYS
    baseline_weight: GPU_BUDGET_FORECAST_BASELINE_WEIGHT
    weekday_history_weight: GPU_BUDGET_FORECAST_WEEKDAY_WEIGHT
    scheduled_jobs_weight: GPU_BUDGET_FORECAST_SCHEDULE_WEIGHT

limits:
  global:
    daily_usd: null
    weekly_usd: null
    monthly_usd: null
  workloads:
    teacher:
      daily_usd: null
      weekly_usd: null
      monthly_usd: null
    student:
      daily_usd: null
      weekly_usd: null
      monthly_usd: null

env_overrides:
  global:
    daily_usd: GPU_BUDGET_GLOBAL_DAILY_USD
    weekly_usd: GPU_BUDGET_GLOBAL_WEEKLY_USD
    monthly_usd: GPU_BUDGET_GLOBAL_MONTHLY_USD
  workloads:
    teacher:
      daily_usd: GPU_BUDGET_TEACHER_DAILY_USD
      weekly_usd: GPU_BUDGET_TEACHER_WEEKLY_USD
      monthly_usd: GPU_BUDGET_TEACHER_MONTHLY_USD
    student:
      daily_usd: GPU_BUDGET_STUDENT_DAILY_USD
      weekly_usd: GPU_BUDGET_STUDENT_WEEKLY_USD
      monthly_usd: GPU_BUDGET_STUDENT_MONTHLY_USD
