name: Contextual Router Promotion Report

on:
  workflow_dispatch:
  schedule:
    - cron: "7 19 * * 0"

permissions:
  contents: read

jobs:
  report:
    strategy:
      matrix:
        workload: [teacher, student]

    runs-on: ubuntu-latest

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_BUCKET: ${{ vars.HF_BUCKET }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r infra/contextual_router/requirements.txt

      - name: Generate contextual promotion report
        run: |
          python infra/contextual_router/promotion_report.py \
            --bucket "$HF_BUCKET" \
            --workload '${{ matrix.workload }}' \
            | tee report.json

          {
            echo "## Contextual Router — ${{ matrix.workload }}"
            echo ""
            echo '```json'
            cat report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
