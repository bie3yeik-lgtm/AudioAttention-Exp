name: Safe Bandit Router

on:
  workflow_dispatch:
    inputs:
      workload:
        type: choice
        required: true
        options:
          - teacher
          - student
      units:
        description: Teacher=input audio hours, Student=epochs
        required: true
        default: "1"
      job_id:
        required: true
      job_spec_path:
        description: Job Spec used for Contextual features
        required: false
        default: examples/job-spec.teacher.json
      prediction_source:
        type: choice
        required: true
        default: auto
        options:
          - auto
          - historical
          - contextual
      mode:
        type: choice
        required: true
        default: shadow
        options:
          - advisory
          - shadow
          - active

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_BUCKET: ${{ vars.HF_BUCKET }}

      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}

      VAST_TEACHER_GPU_QUERY: ${{ vars.VAST_TEACHER_GPU_QUERY }}
      VAST_TEACHER_MAX_DPH: ${{ vars.VAST_TEACHER_MAX_DPH }}
      VAST_TEACHER_DISK_GB: ${{ vars.VAST_TEACHER_DISK_GB }}

      VAST_STUDENT_GPU_QUERY: ${{ vars.VAST_STUDENT_GPU_QUERY }}
      VAST_STUDENT_MAX_DPH: ${{ vars.VAST_STUDENT_MAX_DPH }}
      VAST_STUDENT_DISK_GB: ${{ vars.VAST_STUDENT_DISK_GB }}

      RUNPOD_TEACHER_GPU_IDS: ${{ vars.RUNPOD_TEACHER_GPU_IDS }}
      RUNPOD_TEACHER_MAX_DPH: ${{ vars.RUNPOD_TEACHER_MAX_DPH }}

      RUNPOD_STUDENT_GPU_IDS: ${{ vars.RUNPOD_STUDENT_GPU_IDS }}
      RUNPOD_STUDENT_MAX_DPH: ${{ vars.RUNPOD_STUDENT_MAX_DPH }}

      RUNPOD_CLOUD_TYPE: ${{ vars.RUNPOD_CLOUD_TYPE }}
      COST_ROUTER_PRICE_TOLERANCE: ${{ vars.COST_ROUTER_PRICE_TOLERANCE }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r infra/cost_router/requirements.txt
          pip install -r infra/historical_router/requirements.txt
          pip install -r infra/bandit_router/requirements.txt
          pip install -r infra/contextual_router/requirements.txt
          pip install -r infra/residual_calibration/requirements.txt
          pip install -r infra/conformal_router/requirements.txt
          pip install --upgrade vastai

      - name: Calculate safe Bandit decision
        env:
          PYTHONPATH: infra/bandit_router:infra/historical_router:infra/contextual_router:infra/residual_calibration:infra/conformal_router
        run: |
          python infra/bandit_router/select_bandit.py \
            --workload '${{ inputs.workload }}' \
            --units '${{ inputs.units }}' \
            --job-id '${{ inputs.job_id }}' \
            --job-spec '${{ inputs.job_spec_path }}' \
            --prediction-source '${{ inputs.prediction_source }}' \
            --mode '${{ inputs.mode }}' \
            > bandit-decision.json

          jq . bandit-decision.json

      - name: Persist decision
        run: |
          python infra/bandit_router/write_decision.py \
            --bucket "$HF_BUCKET" \
            --job-id '${{ inputs.job_id }}' \
            --decision bandit-decision.json

      - name: Summary
        run: |
          {
            echo "## Safe Bandit Router"
            echo ""
            echo "- Requested mode: \`$(jq -r '.requested_mode' bandit-decision.json)\`"
            echo "- Effective mode: \`$(jq -r '.effective_mode' bandit-decision.json)\`"
            echo "- Prediction source: \`$(jq -r '.prediction_source' bandit-decision.json)\`"
            echo "- Residual calibration: \`$(jq -r '.residual_calibration.source // "N/A"' bandit-decision.json)\`"
            echo "- Conformal calibration: \`$(jq -r '.conformal_calibration.source // "N/A"' bandit-decision.json)\`"
            echo "- Historical route: \`$(jq -r '.historical_greedy.provider + "/" + .historical_greedy.gpu_id' bandit-decision.json)\`"
            echo "- Bandit recommendation: \`$(jq -r '.bandit_recommendation.provider + "/" + .bandit_recommendation.gpu_id' bandit-decision.json)\`"
            echo "- Paid selection: \`$(jq -r '.selected.provider + "/" + .selected.gpu_id' bandit-decision.json)\`"
            echo "- Paired probes: \`$(jq -r '.paired_probe_count' bandit-decision.json)\`"
            echo "- Gate reasons: \`$(jq -c '.promotion_gate_reasons' bandit-decision.json)\`"
          } >> "$GITHUB_STEP_SUMMARY"
