name: Conformal Router Promotion Report

on:
  workflow_dispatch:
  schedule:
    - cron: "11 20 * * 0"

permissions:
  contents: read

jobs:
  evaluate:
    strategy:
      matrix:
        workload: [teacher, student]

    runs-on: ubuntu-latest

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_BUCKET: ${{ vars.HF_BUCKET }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: pip install -r infra/conformal_router/requirements.txt

      - name: Evaluate empirical coverage
        env:
          PYTHONPATH: infra/conformal_router
        run: |
          python infra/conformal_router/evaluate_coverage.py \
            --bucket "$HF_BUCKET" \
            --workload '${{ matrix.workload }}' \
            | tee report.json

          {
            echo "## Conformal — ${{ matrix.workload }}"
            echo ""
            echo '```json'
            cat report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
