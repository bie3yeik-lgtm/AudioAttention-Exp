name: Contextual Router Shadow

on:
  workflow_dispatch:
    inputs:
      workload:
        type: choice
        required: true
        options:
          - teacher
          - student
      units:
        required: true
        default: "1"
      job_spec_path:
        required: true
        default: examples/job-spec.teacher.json
      mode:
        type: choice
        required: true
        default: shadow
        options:
          - advisory
          - shadow
          - active

permissions:
  contents: read

jobs:
  route:
    runs-on: ubuntu-latest

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_BUCKET: ${{ vars.HF_BUCKET }}

      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}

      VAST_TEACHER_GPU_QUERY: ${{ vars.VAST_TEACHER_GPU_QUERY }}
      VAST_TEACHER_MAX_DPH: ${{ vars.VAST_TEACHER_MAX_DPH }}
      VAST_TEACHER_DISK_GB: ${{ vars.VAST_TEACHER_DISK_GB }}

      VAST_STUDENT_GPU_QUERY: ${{ vars.VAST_STUDENT_GPU_QUERY }}
      VAST_STUDENT_MAX_DPH: ${{ vars.VAST_STUDENT_MAX_DPH }}
      VAST_STUDENT_DISK_GB: ${{ vars.VAST_STUDENT_DISK_GB }}

      RUNPOD_TEACHER_GPU_IDS: ${{ vars.RUNPOD_TEACHER_GPU_IDS }}
      RUNPOD_TEACHER_MAX_DPH: ${{ vars.RUNPOD_TEACHER_MAX_DPH }}

      RUNPOD_STUDENT_GPU_IDS: ${{ vars.RUNPOD_STUDENT_GPU_IDS }}
      RUNPOD_STUDENT_MAX_DPH: ${{ vars.RUNPOD_STUDENT_MAX_DPH }}

      RUNPOD_CLOUD_TYPE: ${{ vars.RUNPOD_CLOUD_TYPE }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r infra/cost_router/requirements.txt
          pip install -r infra/historical_router/requirements.txt
          pip install -r infra/contextual_router/requirements.txt
          pip install --upgrade vastai

      - name: Contextual routing decision
        env:
          PYTHONPATH: infra/contextual_router:infra/historical_router
        run: |
          python infra/contextual_router/select_contextual.py \
            --workload '${{ inputs.workload }}' \
            --units '${{ inputs.units }}' \
            --job-spec '${{ inputs.job_spec_path }}' \
            --mode '${{ inputs.mode }}' \
            > contextual-decision.json

          jq . contextual-decision.json

          {
            echo "## Contextual Router"
            echo ""
            echo "- Model: \`$(jq -r '.model_version' contextual-decision.json)\`"
            echo "- Historical: \`$(jq -r '.historical_greedy.provider + "/" + .historical_greedy.gpu_id' contextual-decision.json)\`"
            echo "- Contextual: \`$(jq -r '.contextual_recommendation.provider + "/" + .contextual_recommendation.gpu_id' contextual-decision.json)\`"
            echo "- Paid route: \`$(jq -r '.selected.provider + "/" + .selected.gpu_id' contextual-decision.json)\`"
            echo "- Predicted runtime: \`$(jq -r '.contextual_recommendation.predicted_runtime_seconds' contextual-decision.json) sec\`"
            echo "- Blended predicted cost: \`$(jq -r '.contextual_recommendation.contextual_blended_total_cost_usd' contextual-decision.json) USD\`"
          } >> "$GITHUB_STEP_SUMMARY"
