name: Shadow Routing Evaluation

on:
  workflow_dispatch:
    inputs:
      workload:
        type: choice
        required: true
        options:
          - teacher
          - student
      units:
        description: Teacher=input audio hours, Student=epochs
        required: true
      job_id:
        description: Completed current-router job ID
        required: true

permissions:
  contents: read

jobs:
  shadow:
    runs-on: ubuntu-latest

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_BUCKET: ${{ vars.HF_BUCKET }}

      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}

      VAST_TEACHER_GPU_QUERY: ${{ vars.VAST_TEACHER_GPU_QUERY }}
      VAST_TEACHER_MAX_DPH: ${{ vars.VAST_TEACHER_MAX_DPH }}
      VAST_TEACHER_DISK_GB: ${{ vars.VAST_TEACHER_DISK_GB }}

      VAST_STUDENT_GPU_QUERY: ${{ vars.VAST_STUDENT_GPU_QUERY }}
      VAST_STUDENT_MAX_DPH: ${{ vars.VAST_STUDENT_MAX_DPH }}
      VAST_STUDENT_DISK_GB: ${{ vars.VAST_STUDENT_DISK_GB }}

      RUNPOD_TEACHER_GPU_IDS: ${{ vars.RUNPOD_TEACHER_GPU_IDS }}
      RUNPOD_TEACHER_MAX_DPH: ${{ vars.RUNPOD_TEACHER_MAX_DPH }}

      RUNPOD_STUDENT_GPU_IDS: ${{ vars.RUNPOD_STUDENT_GPU_IDS }}
      RUNPOD_STUDENT_MAX_DPH: ${{ vars.RUNPOD_STUDENT_MAX_DPH }}

      RUNPOD_CLOUD_TYPE: ${{ vars.RUNPOD_CLOUD_TYPE }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r infra/cost_router/requirements.txt
          pip install -r infra/historical_router/requirements.txt
          pip install -r infra/shadow_router/requirements.txt
          pip install --upgrade vastai

      - name: Run Historical Router in shadow mode
        env:
          PYTHONPATH: infra/historical_router
        run: |
          python infra/historical_router/select_historical.py \
            --workload '${{ inputs.workload }}' \
            --units '${{ inputs.units }}' \
            > shadow-decision.json

          jq . shadow-decision.json

      - name: Evaluate routing regret
        run: |
          python infra/shadow_router/evaluate_shadow.py \
            --bucket "$HF_BUCKET" \
            --job-id '${{ inputs.job_id }}' \
            --historical-decision shadow-decision.json

      - name: Recompute promotion report
        run: |
          python infra/shadow_router/promotion_report.py \
            --bucket "$HF_BUCKET" \
            --workload '${{ inputs.workload }}' \
            > promotion-report.json

          cat promotion-report.json >> "$GITHUB_STEP_SUMMARY"
